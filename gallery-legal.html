<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Consultant Gallery — Deep Ocean Associate</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
<header class="g-header">
  <div class="g-wrap">
    <a href="index.html" class="g-brand"><img src="icon.png" alt="Deep Ocean Associate"><span>Deep Ocean Associate</span></a>
    <a href="index.html#services" class="g-back"><i class="fa fa-arrow-left"></i> Back to Services</a>
  </div>
</header>
<main class="g-wrap">
  <h1>Legal Consultant</h1>
  <p class="g-sub">Documentation, consultation and legal support.</p>
  <div class="g-grid" id="grid">
    <button class="g-item"><img src="https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=900&q=80" alt="Legal Consultant 1" loading="lazy"></button>
    <button class="g-item"><img src="https://images.unsplash.com/photo-1505664194779-8beaceb93744?w=900&q=80" alt="Legal Consultant 2" loading="lazy"></button>
    <button class="g-item"><img src="https://images.unsplash.com/photo-1450101499163-c8848c66ca85?w=900&q=80" alt="Legal Consultant 3" loading="lazy"></button>
    <button class="g-item"><img src="https://images.unsplash.com/photo-1521791055366-0d553872125f?w=900&q=80" alt="Legal Consultant 4" loading="lazy"></button>
    <button class="g-item"><img src="https://images.unsplash.com/photo-1479142506502-19b3a3b7ff33?w=900&q=80" alt="Legal Consultant 5" loading="lazy"></button>
    <button class="g-item"><img src="https://images.unsplash.com/photo-1436450412740-6b988f486c6b?w=900&q=80" alt="Legal Consultant 6" loading="lazy"></button>
  </div>
  <div class="g-cta"><a href="index.html#contact" class="g-btn"><i class="fa fa-phone"></i> Get in Touch</a></div>
</main>
<div class="lightbox" id="lb">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close"><i class="fa fa-times"></i></button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous"><i class="fa fa-chevron-left"></i></button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next"><i class="fa fa-chevron-right"></i></button>
</div>
<script src="gallery.js"></script>
</body>
</html>
