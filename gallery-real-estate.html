<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="theme-color" content="#0A1B33">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="nav" id="nav">
  <div class="wrap">
    <a href="index.html" class="brand" aria-label="Deep Ocean Associate, home"><img src="logo.png" alt="Deep Ocean Associate — Builders &amp; Developers, Real Estate &amp; Marketing" width="160" height="60"></a>
    <nav aria-label="Main">
      <ul class="nav-links">
        <li><a href="index.html#services">Services</a></li>
        <li><a href="index.html#contact" class="nav-cta">Contact us</a></li>
      </ul>
    </nav>
  </div>
</header>
<main id="main">
  <div class="g-top">
    <div class="wrap">
      <a href="index.html#services" class="g-crumb"><i class="fa fa-arrow-left"></i> All services</a>
      <h1>Real Estate &amp; Marketing</h1>
      <p>Current listings and featured properties. Tap any image to view it full size.</p>
    </div>
  </div>
  <div class="g-body">
    <div class="wrap">
      <div class="g-grid" id="grid">
        <button class="g-item" aria-label="View image 1 of 6"><img src="ads/ad1.jpeg" alt="Property listing 1" width="1024" height="1536" loading="lazy"></button>
        <button class="g-item" aria-label="View image 2 of 6"><img src="ads/ad2.jpeg" alt="Property listing 2" width="1024" height="1536" loading="lazy"></button>
        <button class="g-item" aria-label="View image 3 of 6"><img src="ads/ad3.jpeg" alt="Property listing 3" width="1024" height="1536" loading="lazy"></button>
        <button class="g-item" aria-label="View image 4 of 6"><img src="ads/ad4.jpeg" alt="Property listing 4" width="1024" height="1536" loading="lazy"></button>
        <button class="g-item" aria-label="View image 5 of 6"><img src="ads/ad5.jpeg" alt="Property listing 5" width="1024" height="1536" loading="lazy"></button>
        <button class="g-item" aria-label="View image 6 of 6"><img src="ads/ad6.jpeg" alt="Property listing 6" width="1024" height="1536" loading="lazy"></button>
      </div>
      <div class="g-end">
        <a href="tel:+923110264437" class="btn btn-solid"><i class="fa fa-phone"></i> Call 0311 0264437</a>
        <a href="index.html#contact" class="btn btn-line">Other ways to reach us</a>
      </div>
    </div>
  </div>
</main>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close"><i class="fa fa-xmark"></i></button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous image"><i class="fa fa-chevron-left"></i></button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next image"><i class="fa fa-chevron-right"></i></button>
  <span class="lb-count" id="lbCount"></span>
</div>
<script src="gallery.js" defer></script>
<script>document.getElementById('nav').classList.add('solid')</script>
</body>
</html>
